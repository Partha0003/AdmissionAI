version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: admissionai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: admissionai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admissionai_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/admissionai
      - SYNC_DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/admissionai
      - SECRET_KEY=admissionai-super-secret-prototype-key-2026-27
      - INSTITUTION_NAME=XYZ Engineering College
      - INSTITUTION_CODE=XYZ
      - ACADEMIC_YEAR=2026-27
      - ENVIRONMENT=PROTOTYPE
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: admissionai_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
